name: deploy to lambda (dev)

on:
  workflow_dispatch:

jobs:
  deploy_source:
    name: build and deploy lambda (dev)
    strategy:
      matrix:
        node-version: [20.x]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: install dependencies
        working-directory: apps/time-sheets
        run: npm install

      - name: install pdf dependencies
        working-directory: apps/time-sheets/pdf
        run: npm install

      - name: zip
        working-directory: apps/time-sheets
        run: zip -r -D lambda.zip . -i *

      - name: set credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: deploy
        working-directory: apps/time-sheets
        run: |
          aws lambda update-function-code --function-name process-time-sheets-dev --zip-file fileb://lambda.zip
